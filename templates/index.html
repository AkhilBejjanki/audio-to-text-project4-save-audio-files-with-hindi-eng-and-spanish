<!DOCTYPE html>
<html>

<head>
    <title>Offline Audio Transcription</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9f9f9;
            margin: 20px;
        }

        button {
            padding: 6px 10px;
            margin-left: 5px;
            border-radius: 5px;
            border: none;
            background: #28a745;
            color: white;
            cursor: pointer;
            font-size: 13px;
        }

        button:hover {
            background: #1e7e34;
        }


        h1 {
            color: #333;
        }

        #controls {
            margin-bottom: 15px;
        }

        #controls a {
            display: inline-block;
            margin-right: 10px;
            padding: 8px 12px;
            background: #007BFF;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            font-size: 14px;
        }

        #controls a:hover {
            background: #0056b3;
        }

        #controls select {
            background: white;
            color: black;
            border: 1px solid #ccc;
        }

        #log {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            max-height: 500px;
            overflow-y: auto;
        }

        .entry {
            margin-bottom: 10px;
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        .timestamp {
            font-size: 0.9em;
            color: #888;
        }

        .lang {
            font-weight: bold;
            margin-left: 5px;
            color: #007BFF;
        }

        #pagination {
            margin-top: 10px;
            text-align: center;
        }

        #pagination button {
            margin: 0 2px;
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #007BFF;
            background: #fff;
            cursor: pointer;
        }

        #pagination button.active {
            background: #007BFF;
            color: #fff;
        }
    </style>
</head>

<body>
    <h1>🎤 Offline Transcription Dashboard</h1>
    <div id="controls">
        <a href="/download/txt">⬇ TXT</a>
        <a href="/download/csv">⬇ CSV</a>

        <button onclick="setView('transcripts')">🎙 Transcripts</button>
        <button onclick="setView('unknown')">❓ Unknown</button>
        <button onclick="setView('offline')">📵 Offline</button>
        <button onclick="setView('learned')">📘 Learned</button>
        <button onclick="setView('generated')">🔁 Generated</button>
    </div>

    <div id="log"></div>
    <div id="pagination"></div>

    <script>
        let currentView = "transcripts";
        const pageSize = 20;

        function setView(view) {
            currentView = view;
            fetchData();
        }

        async function fetchData() {
            let url = "/data";

            if (currentView === "offline") url = "/offline";
            if (currentView === "unknown") url = "/unknown";
            if (currentView === "learned") url = "/learned";
            if (currentView === "generated") url = "/generated";

            const res = await fetch(url);
            const data = await res.json();

            const log = document.getElementById("log");
            log.innerHTML = "";

            if (data.length === 0) {
                log.innerHTML = "<p>No data available</p>";
                return;
            }

            data.slice(0, pageSize).forEach(item => {
                const div = document.createElement("div");
                div.className = "entry";

                if (currentView === "offline") {
                    div.innerHTML = `
                    <div><b>${item.word}</b> (${item.language})</div>
                    <div class="timestamp">${item.timestamp}</div>
                    ${item.confidence ? `<div>Confidence: ${(item.confidence * 100).toFixed(2)}%</div>` : ""}
                `;
                }

                if (currentView === "transcripts") {
                    div.innerHTML = `
                    <div class="timestamp">${item.timestamp} <b>[${item.language}]</b></div>
                    <div>${item.text}</div>
                    ${item.audio_file ? `<audio controls src="/${item.audio_file}" style="width:250px;"></audio>` : ""}
                `;
                }

                if (currentView === "unknown") {
                    div.innerHTML = `
                    <div><b>${item.word}</b> (${item.language})</div>
                    <div class="timestamp">${item.timestamp}</div>
                `;
                }

                if (currentView === "learned") {
                    div.innerHTML = `
                    <div><b>${item.word}</b> → ${item.meaning}</div>
                    <div>${item.language}</div>
                `;
                }

                if (currentView === "generated") {
                    div.innerHTML = `
                    <div><b>${item.base_word}</b> → ${item.generated_word}</div>
                    <div>Type: ${item.type} | Lang: ${item.language}</div>
                    <div class="timestamp">${item.timestamp}</div>
                `;
                }


                log.appendChild(div);
            });
        }

        fetchData();
    </script>

</body>

</html>
